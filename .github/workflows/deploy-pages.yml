name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and DDS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix website

      - name: Install test browsers
        working-directory: website
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test JavaScript and UI contracts
        run: |
          npm test --prefix website
          npm run test:ui --prefix website

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      - name: Configure WebAssembly engine
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build WebAssembly engine
        run: cmake --build build-wasm --config Release --parallel 2

      - name: Build static website
        run: npm run build --prefix website

      - name: Verify deployment artifacts
        run: test -f website/dist/engine/bridge_engine.wasm

      - name: Smoke-test browser engine
        run: npm run test:wasm --prefix website

      - name: Test auction families across desktop and mobile browsers
        run: npm run test:browser --prefix website

      - name: Test bidding, saved progress and real DDS in Chromium
        run: npm run test:relay:browser --prefix website

      - name: Save browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            website/playwright-report/
            website/test-results/
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
